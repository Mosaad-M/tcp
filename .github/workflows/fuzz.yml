name: Fuzz
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "41 6 * * 0"   # Sundays: a random seed, longer
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per seed"
        default: "600"

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Fuzz (fixed seeds)
        if: github.event_name != 'schedule'
        run: pixi run fuzz "${{ github.event.inputs.iterations || '150' }}" 1 2

      - name: Fuzz (weekly, random seed)
        if: github.event_name == 'schedule'
        run: |
          SEED=$(( $(date +%s) % 1000000007 ))
          echo "seed $SEED"
          pixi run fuzz 600 "$SEED"
